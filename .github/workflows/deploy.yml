# jung6tax.com 자동 배포
# main 브랜치에 코드가 올라가면 사장님 Cloudflare 계정의 Pages 프로젝트로 자동 배포됩니다.
# 필요한 GitHub 비밀값: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# (Settings → Secrets and variables → Actions 에 등록)
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: jung6tax
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # 처음 한 번만 프로젝트가 만들어지고, 이미 있으면 그냥 넘어갑니다.
      - name: Create Pages project if missing
        run: |
          if npx wrangler pages project list 2>/dev/null | grep -q "$PROJECT_NAME"; then
            echo "Pages project '$PROJECT_NAME' already exists"
          else
            npx wrangler pages project create "$PROJECT_NAME" --production-branch main
          fi

      - name: Deploy
        run: npx wrangler pages deploy dist --project-name "$PROJECT_NAME" --branch main --commit-dirty=true
