<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B1A1A"/>
      <stop offset="100%" style="stop-color:#1A2A4A"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <!-- 장식용 원형 -->
  <circle cx="560" cy="60" r="120" fill="white" opacity="0.06"/>
  <circle cx="80" cy="340" r="90" fill="white" opacity="0.04"/>
  <!-- 아이콘 배경 원 -->
  <circle cx="320" cy="170" r="62" fill="white" opacity="0.15" filter="url(#shadow)"/>
  <!-- 아이콘 -->
  <g transform="translate(320,170)">
    <path d="M-20,-18 L12,-18 L20,-10 L20,18 L-20,18 Z M12,-18 L12,-10 L20,-10 M-14,-10 L8,-10 M-14,-4 L14,-4 M-14,2 L14,2 M-14,8 L8,8 M-14,14 L12,14" stroke="white" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <!-- 카테고리 라벨 (한글) -->
  <text x="320" y="275" font-family="Noto Sans KR, sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle">세법개정·시사</text>
  <!-- 카테고리 영문 -->
  <text x="320" y="305" font-family="Noto Sans KR, sans-serif" font-size="14" font-weight="500" fill="white" opacity="0.7" text-anchor="middle" letter-spacing="2">TAX NEWS</text>
  <!-- 하단 브랜드 바 -->
  <rect x="0" y="385" width="640" height="15" fill="#C9A84C" opacity="0.8"/>
</svg>
